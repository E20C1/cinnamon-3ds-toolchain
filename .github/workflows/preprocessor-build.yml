name: preprocessor-build

on:
  push:
    paths:
      - "tools/n3ds-preprocess/**"
      - "src/binary_reader.c"
      - "src/data_win.c"
      - "src/gl/image_decoder.c"
      - "vendor/**"
      - "scripts/build-preprocessor.ps1"
      - "scripts/preprocess-game.ps1"
      - "scripts/setup-windows.ps1"
      - "scripts/build-n3ds.ps1"
      - "scripts/stage-n3ds-sd.ps1"
      - "build-windows-n3ds.ps1"
      - "build-new3ds.cmd"
      - "setup-windows.cmd"
      - ".github/workflows/preprocessor-build.yml"
  pull_request:
    paths:
      - "tools/n3ds-preprocess/**"
      - "src/binary_reader.c"
      - "src/data_win.c"
      - "src/gl/image_decoder.c"
      - "vendor/**"
      - "scripts/build-preprocessor.ps1"
      - "scripts/preprocess-game.ps1"
      - "scripts/setup-windows.ps1"
      - "scripts/build-n3ds.ps1"
      - "scripts/stage-n3ds-sd.ps1"
      - "build-windows-n3ds.ps1"
      - "build-new3ds.cmd"
      - "setup-windows.cmd"
      - ".github/workflows/preprocessor-build.yml"

jobs:
  linux-host-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tools/n3ds-preprocess -B build/ci-preprocessor -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/ci-preprocessor --config Release
      - name: Record SHA-256
        run: sha256sum build/ci-preprocessor/n3ds-preprocess

  windows-host-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell wrappers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @("scripts/build-preprocessor.ps1", "scripts/preprocess-game.ps1", "scripts/setup-windows.ps1", "scripts/build-n3ds.ps1", "scripts/stage-n3ds-sd.ps1", "build-windows-n3ds.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $path"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { exit 1 }
      - name: Build preprocessor through repository wrapper
        shell: pwsh
        run: .\scripts\build-preprocessor.ps1
